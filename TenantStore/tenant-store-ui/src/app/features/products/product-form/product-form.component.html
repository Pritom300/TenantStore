<div class="product-form-container">
  <div class="form-card">
    <h2>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h2>
    
    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      
      <!-- Image Upload Section -->
      <div class="image-upload-section">
        <label>Product Image</label>
        
        <div class="image-preview" *ngIf="imagePreview">
          <img [src]="imagePreview" alt="Product preview" />
          <button type="button" class="btn-remove-image" (click)="removeImage()">
            ✕ Remove
          </button>
        </div>

        <div class="image-upload" *ngIf="!imagePreview">
          <div class="upload-placeholder">
            <span class="upload-icon">📷</span>
            <p>Click to upload product image</p>
            <small>JPG, PNG, GIF, WEBP (Max 5MB)</small>
          </div>
          <input 
            type="file" 
            accept="image/*"
            (change)="onFileSelected($event)"
            class="file-input"
          />
        </div>

        <div class="uploading-indicator" *ngIf="uploadingImage">
          <div class="spinner"></div>
          <span>Uploading image...</span>
        </div>
      </div>

      <div class="form-group">
        <label for="name">Product Name *</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="productData.name" 
          name="name"
          placeholder="Enter product name"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea 
          id="description" 
          [(ngModel)]="productData.description" 
          name="description"
          rows="4"
          placeholder="Enter product description"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="price">Price *</label>
          <input 
            type="number" 
            id="price" 
            [(ngModel)]="productData.price" 
            name="price"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          />
        </div>

        <div class="form-group">
          <label for="stock">Stock *</label>
          <input 
            type="number" 
            id="stock" 
            [(ngModel)]="productData.stock" 
            name="stock"
            min="0"
            placeholder="0"
            required
          />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" (click)="cancel()" class="btn-cancel">
          Cancel
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading || uploadingImage">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update Product' : 'Create Product') }}
        </button>
      </div>
    </form>
  </div>
</div>
